<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Leads · Registro de Marca</title>
<style>
:root{--f:#f6f7f9;--c:#fff;--t:#12181f;--m:#5b6672;--l:#e4e8ec;
  --q:#b3261e;--mo:#8a6d1f;--fr:#5b6672;--wa:#128c7e;--ac:#0f3d5c}
@media(prefers-color-scheme:dark){:root{--f:#0e1216;--c:#171d24;--t:#eef2f6;
  --m:#98a4b0;--l:#252d36;--q:#f2795f;--mo:#e0be5c;--fr:#98a4b0;--wa:#25d366;--ac:#7fb3d5}}
*{box-sizing:border-box}
body{margin:0;background:var(--f);color:var(--t);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.topo{position:sticky;top:0;background:var(--c);border-bottom:1px solid var(--l);
  padding:14px 16px;z-index:5}
.topo h1{margin:0;font-size:1.06rem;letter-spacing:-.01em}
.res{margin-top:4px;font-size:.82rem;color:var(--m)}
.filtros{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.filtros button{border:1px solid var(--l);background:transparent;color:var(--m);
  padding:6px 13px;border-radius:999px;font-size:.8rem;cursor:pointer;font-weight:600}
.filtros button.on{background:var(--t);color:var(--c);border-color:var(--t)}
main{padding:14px 16px 40px;max-width:44rem;margin:0 auto;
  display:flex;flex-direction:column;gap:12px}
.lead{background:var(--c);border:1px solid var(--l);border-radius:12px;
  padding:15px 16px;border-left:4px solid var(--fr)}
.lead.quente{border-left-color:var(--q)}
.lead.morno{border-left-color:var(--mo)}
.lead.atendido{opacity:.45}
.lead header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.lead h2{margin:0;font-size:1.04rem;line-height:1.3}
.quando{font-size:.78rem;color:var(--m);margin-top:2px}
.selo{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid currentColor;color:var(--fr);
  white-space:nowrap}
.selo.quente{color:var(--q)} .selo.morno{color:var(--mo)}
.marca{margin:12px 0 10px;font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
.marca span{display:block;font-size:.66rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--m);margin-bottom:1px}
dl{margin:0 0 13px;display:grid;gap:7px}
dl div{display:grid;grid-template-columns:104px 1fr;gap:10px;font-size:.86rem}
dt{color:var(--m)} dd{margin:0}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wa{background:var(--wa);color:#fff;text-decoration:none;padding:9px 15px;
  border-radius:8px;font-weight:600;font-size:.88rem}
.tel{color:var(--ac);text-decoration:none;font-size:.88rem;font-weight:600}
.feito{margin-left:auto;border:1px solid var(--l);background:transparent;
  color:var(--m);padding:7px 12px;border-radius:8px;font-size:.8rem;cursor:pointer}
.email{margin-top:10px;font-size:.8rem;color:var(--m);word-break:break-all}
.vazio{text-align:center;color:var(--m);padding:56px 20px;font-size:.92rem}
</style></head><body>

<div class="topo">
  <h1>Leads · Registro de Marca</h1>
  <div class="res"><b>0</b> no total · <b>0</b> de prioridade
    · último em —</div>
  <div class="filtros">
    <button class="on" data-f="todos">Todos</button>
    <button data-f="quente">Prioridade</button>
    <button data-f="pendentes">Não atendidos</button>
  </div>
</div>

<main id="lista">
<div class="vazio">Nenhum lead ainda.<br>Assim que o primeiro chegar, ele aparece aqui.</div>
</main>

<script>
/* "atendido" fica no proprio aparelho. NAO e compartilhado entre a equipe —
   se a Bruna marcar no celular dela, o Kaique continua vendo como pendente. */
var FEITOS = JSON.parse(localStorage.getItem('oc_leads_feitos') || '[]');
function pinta(){
  document.querySelectorAll('.lead').forEach(function(el){
    var f = FEITOS.indexOf(el.dataset.id) >= 0;
    el.classList.toggle('atendido', f);
    var b = el.querySelector('.feito');
    if (b) b.textContent = f ? 'Atendido' : 'Marcar atendido';
  });
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.feito'); if(!b) return;
  var id = b.closest('.lead').dataset.id;
  var i = FEITOS.indexOf(id);
  if (i >= 0) FEITOS.splice(i,1); else FEITOS.push(id);
  localStorage.setItem('oc_leads_feitos', JSON.stringify(FEITOS));
  pinta(); aplica();
});
var filtro = 'todos';
function aplica(){
  document.querySelectorAll('.lead').forEach(function(el){
    var ok = filtro === 'todos'
      || (filtro === 'quente'    && el.dataset.temp === 'quente')
      || (filtro === 'pendentes' && FEITOS.indexOf(el.dataset.id) < 0);
    el.style.display = ok ? '' : 'none';
  });
}
document.querySelectorAll('.filtros button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.filtros button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on'); filtro = b.dataset.f; aplica();
  });
});
pinta(); aplica();
setTimeout(function(){ location.reload(); }, 120000);
</script>
</body></html>
